name: Deploy edge functions

# Deploys supabase/functions/** to the Supabase project the app points at.
# Everything runs on GitHub's servers — the Supabase CLI is never installed
# on your machine.
#
# One-time setup: Settings → Secrets and variables → Actions → New secret
#   SUPABASE_ACCESS_TOKEN   from https://supabase.com/dashboard/account/tokens
#
# The project is NOT configured here. It is read out of js/config.js, so the
# function always lands on the same project the app talks to. Repointing the
# app repoints the deploy, and the two cannot drift apart.

on:
  push:
    branches: [main, master]
    paths:
      - 'supabase/functions/**'
      - 'js/config.js'
      - '.github/workflows/functions.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: functions
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read the project out of js/config.js
        id: cfg
        run: |
          url=$(sed -n "s/.*SUPABASE_URL: '\(.*\)'.*/\1/p" js/config.js)
          key=$(sed -n "s/.*SUPABASE_ANON_KEY: '\(.*\)'.*/\1/p" js/config.js)
          ref=$(printf '%s' "$url" | sed -n 's#^https://\([a-z0-9-]*\)\.supabase\.co$#\1#p')
          if [ -z "$ref" ]; then
            echo "::error::Could not read a Supabase project URL from js/config.js (got '$url')."
            exit 1
          fi
          echo "Deploying to project $ref"
          echo "ref=$ref"  >> "$GITHUB_OUTPUT"
          echo "url=$url"  >> "$GITHUB_OUTPUT"
          echo "key=$key"  >> "$GITHUB_OUTPUT"

      - name: Set up the Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy every function
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::SUPABASE_ACCESS_TOKEN is not set. Add it under Settings → Secrets and variables → Actions."
            exit 1
          fi
          for dir in supabase/functions/*/; do
            name=$(basename "$dir")
            case "$name" in _*) continue ;; esac
            echo "── deploying $name"
            supabase functions deploy "$name" --project-ref "${{ steps.cfg.outputs.ref }}"
          done

      # Deploying and *working* are different things. Ask the live function
      # what it thinks of an anon-key call: it checks GROQ_API_KEY before it
      # checks the caller, so one request tells us both that the function is
      # reachable and that the key is present.
      - name: Check the function actually answers
        run: |
          url='${{ steps.cfg.outputs.url }}/functions/v1/analyse'
          key='${{ steps.cfg.outputs.key }}'
          body=$(curl -s -w '\n%{http_code}' -X POST "$url" \
            -H "apikey: $key" -H "Authorization: Bearer $key" \
            -H 'Content-Type: application/json' -d '{"summary":{"ci":true}}')
          code=$(printf '%s' "$body" | tail -n1)
          text=$(printf '%s' "$body" | sed '$d')
          echo "HTTP $code — $text"

          case "$text" in
            *NOT_FOUND*)
              echo "::error::The function is not reachable after deploying. Check the job log above."
              exit 1 ;;
            *GROQ_API_KEY*)
              echo "::warning::Deployed, but GROQ_API_KEY is not set on the project. Add it under Edge Functions → Secrets; the analysis will fail until you do."
              exit 0 ;;
          esac

          if [ "$code" = "401" ]; then
            echo "Healthy: the function is live and the Groq key is set."
            echo "(401 is expected here — an anon key is not a signed-in user.)"
            exit 0
          fi
          echo "::error::Unexpected reply from the deployed function."
          exit 1
