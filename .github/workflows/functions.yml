name: Deploy edge functions

# Deploys supabase/functions/** to the Supabase project the app points at.
# Everything runs on GitHub's servers — the Supabase CLI is never installed
# on your machine.
#
# One-time setup: Settings → Secrets and variables → Actions → New secret
#   SUPABASE_ACCESS_TOKEN   from https://supabase.com/dashboard/account/tokens
#
# The project is NOT configured here. It is read out of js/config.js, so the
# function always lands on the same project the app talks to. Repointing the
# app repoints the deploy, and the two cannot drift apart.

on:
  push:
    branches: [main, master]
    paths:
      - 'supabase/functions/**'
      - 'js/config.js'
      - '.github/workflows/functions.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: functions
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read the project out of js/config.js
        id: cfg
        run: |
          url=$(sed -n "s/.*SUPABASE_URL: '\(.*\)'.*/\1/p" js/config.js)
          key=$(sed -n "s/.*SUPABASE_ANON_KEY: '\(.*\)'.*/\1/p" js/config.js)
          ref=$(printf '%s' "$url" | sed -n 's#^https://\([a-z0-9-]*\)\.supabase\.co$#\1#p')
          if [ -z "$ref" ]; then
            echo "::error::Could not read a Supabase project URL from js/config.js (got '$url')."
            exit 1
          fi
          echo "Deploying to project $ref"
          echo "ref=$ref"  >> "$GITHUB_OUTPUT"
          echo "url=$url"  >> "$GITHUB_OUTPUT"
          echo "key=$key"  >> "$GITHUB_OUTPUT"

      - name: Set up the Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy every function
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::SUPABASE_ACCESS_TOKEN is not set. Add it under Settings → Secrets and variables → Actions."
            exit 1
          fi
          for dir in supabase/functions/*/; do
            name=$(basename "$dir")
            case "$name" in _*) continue ;; esac
            echo "── deploying $name"
            supabase functions deploy "$name" --project-ref "${{ steps.cfg.outputs.ref }}"
          done

      # Deploying and *working* are different things. Ask each live
      # function what it thinks of an anon-key call: they check
      # GROQ_API_KEY before they check the caller, so one request per
      # function tells us both that it is reachable and that the key is
      # there. Checking only the first would let a broken second one
      # ship green.
      - name: Check every function actually answers
        run: |
          base='${{ steps.cfg.outputs.url }}/functions/v1'
          key='${{ steps.cfg.outputs.key }}'
          failed=0

          for dir in supabase/functions/*/; do
            name=$(basename "$dir")
            case "$name" in _*) continue ;; esac

            body=$(curl -s -w '\n%{http_code}' -X POST "$base/$name" \
              -H "apikey: $key" -H "Authorization: Bearer $key" \
              -H 'Content-Type: application/json' -d '{"probe":true}')
            code=$(printf '%s' "$body" | tail -n1)
            text=$(printf '%s' "$body" | sed '$d')
            echo "── $name: HTTP $code — $text"

            case "$text" in
              *NOT_FOUND*)
                echo "::error::$name is not reachable after deploying."
                failed=1; continue ;;
              *GROQ_API_KEY*)
                echo "::warning::$name deployed, but GROQ_API_KEY is not set on the project. Add it under Edge Functions → Secrets."
                continue ;;
            esac

            # 401 is the expected healthy answer: an anon key is not a
            # signed-in user, and the key check already passed to get here.
            if [ "$code" = "401" ]; then
              echo "   healthy — live, and the Groq key is set."
            else
              echo "::error::$name gave an unexpected reply."
              failed=1
            fi
          done

          exit $failed
